group = "com.example.flutter_torrent_streamer"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

tasks.matching { it.name == "preBuild" }.configureEach {
    doFirst {
        ["arm64-v8a", "x86_64"].each { abi ->
            def library = file("src/main/jniLibs/${abi}/libtorrent_streamer.so")
            if (!library.isFile()) {
                throw new GradleException("Patched BT engine missing: ${library}. Run third_party/flutter_go_torrent_streamer/go/build_android.sh first.")
            }
        }
    }
}

android {
    namespace = "com.example.flutter_torrent_streamer"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        // Explicitly map jniLibs to the correct folder
        main.jniLibs.srcDirs = ["src/main/jniLibs"]
        test.java.srcDirs += "src/test/kotlin"
    }


    defaultConfig {
        minSdk = 21
    }

    dependencies {
        implementation "androidx.core:core-ktx:1.10.1"
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
