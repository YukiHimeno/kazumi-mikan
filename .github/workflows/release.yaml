name: Android release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build g++
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get dependencies
        run: flutter pub get
      - name: Build Android arm64 APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Verify arm64 BT engine is packaged
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-list.txt"
          grep -Fxq 'lib/arm64-v8a/libtorrent_streamer.so' "$RUNNER_TEMP/apk-list.txt"
          if grep -q '^lib/armeabi-v7a/' "$RUNNER_TEMP/apk-list.txt"; then
            echo 'Unexpected 32-bit libraries in arm64 APK' >&2
            exit 1
          fi
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-mikan-android
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
